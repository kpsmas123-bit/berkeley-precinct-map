<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Berkeley Precinct Election Map</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --panel: 360px; --bg: #f7f7f5; --ink: #1a1a1a; --muted: #6b6b6b; --line: #e2e2dd; --gold:#e8a400; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); }
  #app { display: grid; grid-template-columns: 1fr var(--panel); height: 100%; }
  #map { position: relative; }
  #panel { border-left: 1px solid var(--line); background: #fff; overflow-y: auto; padding: 16px 18px 48px; }
  #controls { position: absolute; top: 12px; left: 12px; z-index: 5; background: rgba(255,255,255,.96);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 330px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  #controls h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .2px; }
  #controls .sub { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 8px 0 3px; }
  select { width: 100%; padding: 6px 8px; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .modes { display: flex; gap: 4px; margin-top: 4px; }
  .modes button { flex: 1; font-size: 12px; padding: 6px 4px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; }
  .modes button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  #rcvNote { display: none; margin-top: 8px; font-size: 11px; background: #fff7e6; border: 1px solid #f0d9a8; color: #8a5a00; padding: 6px 8px; border-radius: 6px; }
  #legend { position: absolute; bottom: 14px; left: 12px; z-index: 5; background: rgba(255,255,255,.96);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 300px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  #legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #legend .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); flex: none; }
  .dhead { display:flex; align-items:baseline; justify-content:space-between; gap:8px; border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:2px; }
  .dhead h2 { font-size: 17px; margin: 0; }
  .dhead .mem { font-size: 12px; color: var(--muted); }
  .vintage { font-size: 11px; color: var(--muted); margin: 4px 0 14px; }
  .reset { font-size: 12px; color:#2a6; cursor:pointer; text-decoration:underline; background:none;border:none;padding:0; }
  .contestTitle { font-size: 14px; margin: 4px 0 2px; }
  .subtotal { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0 16px; }
  .subtotal .lbl { font-size: 11px; text-transform: uppercase; letter-spacing:.5px; color: var(--muted); margin-bottom: 4px; }
  .prec { margin: 0 0 16px; }
  .prec .ph { display:flex; align-items:baseline; justify-content:space-between; cursor:pointer; }
  .prec .ph:hover .pid { text-decoration: underline; }
  .prec .pid { font-weight: 600; font-size: 13px; }
  .prec.focus .pid { color: #111; }
  .prec .turn { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  table.res { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  table.res td { padding: 3px 2px; border-bottom: 1px solid var(--line); }
  table.res td.v { text-align: right; font-variant-numeric: tabular-nums; }
  table.res td.p { text-align: right; color: var(--muted); width: 48px; font-variant-numeric: tabular-nums; }
  table.res tr.win td { font-weight: 700; }
  .bar { height: 4px; background: #d9d9d3; border-radius: 2px; margin-top: 3px; }
  .bar > span { display: block; height: 100%; border-radius: 2px; }
  .noballot { font-size:12px; color: var(--muted); font-style: italic; margin-top:4px; }
  .credit { font-size: 11px; color: var(--muted); margin-top: 24px; line-height: 1.5; }
  a.src { color: #2a6; }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div id="controls">
      <h1>Berkeley Precinct Election Map</h1>
      <div class="sub" id="focusNote">Click any precinct to jump to its council district. Default: District&nbsp;1.</div>
      <label>Election</label>
      <select id="electionSel"></select>
      <label>Contest</label>
      <select id="contestSel"></select>
      <label>Map mode</label>
      <div class="modes">
        <button data-mode="winner" class="active">Winner</button>
        <button data-mode="choice">% for choice</button>
        <button data-mode="turnout">Turnout</button>
      </div>
      <div id="choiceWrap" style="display:none">
        <label>Choice</label>
        <select id="choiceSel"></select>
      </div>
      <div id="rcvNote">⚑ Ranked-choice contest — precinct data is <b>first-choice only</b>. No precinct-level RCV redistribution exists.</div>
    </div>
    <div id="legend"></div>
  </div>
  <div id="panel"></div>
</div>
<script>
const DATA = "./data";
const CAT = ["#4e79a7","#e15759","#59a14f","#f28e2b","#b07aa1","#76b7b2","#edc948","#9c755f","#bab0ac","#ff9da7"];
const YESNO = { "YES":"#2b8cbe", "NO":"#e34a33" };
const RAMP = ["#f7fbff","#c6dbef","#6baed6","#2171b5","#08306b"];
const MAP_LABEL = { "berkeley-council-2021":"2021 redistricting", "berkeley-council-2013":"2013 map (2010 census)" };

const state = { election:null, contest:null, mode:"winner", choice:null, district:"1", focus:null, results:null, catalog:null, dmembers:{} };
let map, elections;

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const winnerOf = ch => Object.entries(ch).filter(([k])=>!k.startsWith("_")).reduce((a,b)=> b[1]>a[1]?b:a, ["",-1]);
const hex2rgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function rampColor(t){ const n=RAMP.length-1, x=Math.max(0,Math.min(1,t))*n, i=Math.floor(x), f=x-i;
  const a=hex2rgb(RAMP[i]), b=hex2rgb(RAMP[Math.min(i+1,n)]);
  return `rgb(${a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(",")})`; }

async function boot() {
  elections = (await (await fetch(`${DATA}/elections.json`)).json()).elections;
  const esel = document.getElementById("electionSel");
  elections.forEach(e => esel.add(new Option(e.name, e.id)));
  map = new maplibregl.Map({
    container: "map",
    style: { version:8,
      glyphs:"https://basemaps.cartocdn.com/gl/positron-gl-style/glyphs/{fontstack}/{range}.pbf",
      sources:{ carto:{ type:"raster", tiles:["https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png"], tileSize:256, attribution:"© OpenStreetMap © CARTO" } },
      layers:[{ id:"base", type:"raster", source:"carto" }] },
    center:[-122.29,37.884], zoom:12.4 });
  window._map = map;
  map.on("error", e => console.error("MAP ERROR:", e && e.error && e.error.message));
  map.addControl(new maplibregl.NavigationControl({ showCompass:false }), "bottom-right");
  map.on("load", async () => {
    try {
      parseHash();
      esel.value = state.election;
      await loadElection(state.election);
      wireControls();
      window._ready = true;
    } catch (err) { console.error("LOAD HANDLER FAILED:", err && err.stack || err); }
  });
}

function eachCoord(geom, fn){ const walk=a=>{ if(typeof a[0]==="number") fn(a); else a.forEach(walk); }; walk(geom.coordinates); }

async function loadElection(id) {
  state.election = id;
  const meta = elections.find(e=>e.id===id);
  state.results = await (await fetch(`${DATA}/${meta.results}`)).json();
  state.catalog = state.results.contests;

  ["precincts-fill","precincts-line","precincts-sel","districts-all","districts-focus"].forEach(l=>{ if(map.getLayer(l)) map.removeLayer(l); });
  ["precincts","districts"].forEach(s=>{ if(map.getSource(s)) map.removeSource(s); });

  const geo = await (await fetch(`${DATA}/${meta.geo}`)).json();
  const dgeo = await (await fetch(`${DATA}/${meta.districts_geo}`)).json();
  state.dmembers = {}; dgeo.features.forEach(f=> state.dmembers[String(f.properties.district)] = f.properties.member);

  map.addSource("precincts", { type:"geojson", data:geo, promoteId:"precinct" });
  map.addSource("districts", { type:"geojson", data:dgeo });
  map.addLayer({ id:"precincts-fill", type:"fill", source:"precincts",
    paint:{ "fill-color":["coalesce",["feature-state","color"],"#ddd"], "fill-opacity":0.82 } });
  map.addLayer({ id:"precincts-line", type:"line", source:"precincts",
    paint:{ "line-color":"#fff", "line-width":0.6 } });
  // group / focus highlight driven by feature-state "sel" (1=in group, 2=focused precinct)
  map.addLayer({ id:"precincts-sel", type:"line", source:"precincts", paint:{
    "line-color":["case",["==",["feature-state","sel"],2],"#111",["==",["feature-state","sel"],1],"#e8a400","rgba(0,0,0,0)"],
    "line-width":["case",["==",["feature-state","sel"],2],3,["==",["feature-state","sel"],1],1.8,0] } });
  map.addLayer({ id:"districts-all", type:"line", source:"districts",
    paint:{ "line-color":"#888", "line-width":0.8, "line-dasharray":[2,2], "line-opacity":0.5 } });
  map.addLayer({ id:"districts-focus", type:"line", source:"districts",
    filter:["==",["get","district"], state.district],
    paint:{ "line-color":"#111", "line-width":2.4 } });

  const b = new maplibregl.LngLatBounds();
  geo.features.forEach(f => eachCoord(f.geometry, c => b.extend(c)));
  map.fitBounds(b, { padding:{top:110,left:360,right:40,bottom:60}, duration:0 });

  map.on("click", "precincts-fill", e => {
    const pid = e.features[0].properties.precinct;
    const d = state.results.precincts[pid]?.district;
    if (d==null) return;
    state.district = d; state.focus = pid;
    render();
  });
  map.on("mouseenter","precincts-fill",()=>map.getCanvas().style.cursor="pointer");
  map.on("mouseleave","precincts-fill",()=>map.getCanvas().style.cursor="");

  buildContestPicker();
  if (!state.contest || !(state.contest in state.catalog)) state.contest = pickDefaultContest();
  if (!(state.district in state.results.districts)) { state.district = "1"; state.focus = null; }
  render();
}

const pickDefaultContest = () => { const n=Object.keys(state.catalog); return n.find(x=>/^Mayor - Berkeley/.test(x))||n[0]; };

function buildContestPicker(){
  const sel=document.getElementById("contestSel"); sel.innerHTML="";
  const names=Object.keys(state.catalog);
  const grp=(label,arr)=>{ if(!arr.length)return; const og=document.createElement("optgroup"); og.label=label;
    arr.forEach(n=>og.appendChild(new Option(n+(state.catalog[n].rcv?"  (RCV)":""),n))); sel.appendChild(og); };
  grp("Berkeley city / schools", names.filter(n=>/Berkeley/.test(n)));
  grp("County · State · Federal · Props", names.filter(n=>!/Berkeley/.test(n)));
  sel.value=state.contest;
}
function buildChoicePicker(){
  const sel=document.getElementById("choiceSel"); sel.innerHTML="";
  state.catalog[state.contest].choices.forEach(c=>sel.add(new Option(c,c)));
  if(!state.choice || !state.catalog[state.contest].choices.includes(state.choice)) state.choice=state.catalog[state.contest].choices[0];
  sel.value=state.choice;
}
function colorForContest(){
  const {choices,kind}=state.catalog[state.contest]; const cmap={};
  choices.forEach((c,i)=>{ cmap[c]= kind==="measure"&&YESNO[c.toUpperCase()] ? YESNO[c.toUpperCase()] : CAT[i%CAT.length]; });
  return cmap;
}

function render(){
  if (state._pendingContestSlug){ const m=Object.keys(state.catalog).find(n=>slug(n)===state._pendingContestSlug); if(m)state.contest=m; state._pendingContestSlug=null; }
  if (state._pendingChoiceSlug){ const m=(state.catalog[state.contest]?.choices||[]).find(c=>slug(c)===state._pendingChoiceSlug); if(m)state.choice=m; state._pendingChoiceSlug=null; }

  const cat=state.catalog[state.contest];
  document.getElementById("rcvNote").style.display = cat.rcv?"block":"none";
  document.getElementById("choiceWrap").style.display = state.mode==="choice"?"block":"none";
  document.getElementById("contestSel").value=state.contest;
  if(state.mode==="choice") buildChoicePicker();

  paintChoropleth(colorForContest());
  map.setFilter("districts-focus", ["==",["get","district"], state.district]);
  setHighlights();
  buildLegend(colorForContest());
  showDistrict();
  updateHash();
}

function paintChoropleth(cmap){
  const P=state.results.precincts;
  for(const [pid,p] of Object.entries(P)){
    let color="#e5e5e5";
    if(state.mode==="turnout"){ color=rampColor(p.registered? p.ballots_cast/p.registered:0); }
    else{ const c=p.contests[state.contest];
      if(c){ if(state.mode==="winner"){ const [w]=winnerOf(c.choices); color=cmap[w]||"#bbb"; }
        else{ const tot=Object.values(c.choices).reduce((a,b)=>a+b,0); color=rampColor(tot?(c.choices[state.choice]||0)/tot:0); } }
      else color="#eee"; }
    map.setFeatureState({source:"precincts", id:pid}, {color});
  }
}
function setHighlights(){
  const group=new Set(state.results.districts[state.district]||[]);
  for(const pid of Object.keys(state.results.precincts)){
    const sel = pid===state.focus ? 2 : (group.has(pid)?1:0);
    map.setFeatureState({source:"precincts", id:pid}, {sel});
  }
}

function buildLegend(cmap){
  const el=document.getElementById("legend"); const cat=state.catalog[state.contest];
  if(state.mode==="turnout") el.innerHTML=`<div style="font-weight:600;margin-bottom:4px">Turnout (ballots / registered)</div>`+gradientBar(["0%","25%","50%","75%","100%"]);
  else if(state.mode==="choice") el.innerHTML=`<div style="font-weight:600;margin-bottom:4px">% for ${esc(state.choice)}</div>`+gradientBar(["0%","","50%","","100%"]);
  else el.innerHTML=`<div style="font-weight:600;margin-bottom:4px">Winner${cat.rcv?" (1st choice)":""}</div>`+cat.choices.map(c=>`<div class="row"><span class="sw" style="background:${cmap[c]}"></span>${esc(c)}</div>`).join("");
}
const gradientBar=labels=>`<div style="height:12px;border-radius:3px;background:linear-gradient(90deg,${RAMP.join(",")})"></div>`+
  `<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px">`+labels.map(l=>`<span>${l}</span>`).join("")+`</div>`;

function resultsTable(choices, cmap, win){
  const entries=Object.entries(choices).sort((a,b)=>b[1]-a[1]);
  const tot=entries.reduce((a,[,v])=>a+v,0);
  return `<table class="res">`+entries.map(([name,v])=>{ const pct=tot?100*v/tot:0;
    return `<tr class="${name===win?"win":""}"><td>${esc(name)}<div class="bar"><span style="width:${pct.toFixed(1)}%;background:${cmap[name]||"#999"}"></span></div></td>`+
      `<td class="v">${v.toLocaleString()}</td><td class="p">${pct.toFixed(1)}%</td></tr>`; }).join("")+`</table>`;
}

function showDistrict(){
  const panel=document.getElementById("panel");
  const cat=state.catalog[state.contest], cmap=colorForContest();
  const d=state.district, member=state.dmembers[d];
  const pids=state.results.districts[d]||[];
  const vintage=MAP_LABEL[state.results.district_map]||state.results.district_map;

  let html=`<div class="dhead"><h2>District ${esc(d)}</h2>`
    + (state.district!=="1" ? `<button class="reset" id="resetBtn">↩ back to District 1</button>` : `<span class="mem">focus district</span>`)
    + `</div>`
    + (member?`<div class="vintage">${esc(member)} · boundaries: ${esc(vintage)}</div>`:`<div class="vintage">boundaries: ${esc(vintage)}</div>`)
    + `<div class="contestTitle"><b>${esc(state.contest)}</b>${cat.rcv?`  ·  <span style="color:#8a5a00">RCV, first-choice only</span>`:""}</div>`;

  // district subtotal for the selected contest (across precincts that carry it)
  const sub={}; let carriers=0;
  pids.forEach(pid=>{ const c=state.results.precincts[pid].contests[state.contest];
    if(c){ carriers++; for(const [k,v] of Object.entries(c.choices)) sub[k]=(sub[k]||0)+v; } });
  if(carriers){ const [win]=winnerOf(sub); const tot=Object.values(sub).reduce((a,b)=>a+b,0);
    html+=`<div class="subtotal"><div class="lbl">District ${esc(d)} subtotal · ${carriers} precinct${carriers>1?"s":""} · ${tot.toLocaleString()} ${cat.rcv?"first-choice ":""}votes</div>`
      + resultsTable(sub,cmap,win)+`</div>`;
  } else {
    html+=`<div class="noballot">“${esc(state.contest)}” was not on the ballot in District ${esc(d)}.</div>`;
  }

  // per-precinct breakdown
  pids.forEach(pid=>{ const p=state.results.precincts[pid], c=p.contests[state.contest];
    const tpct=p.registered?(100*p.ballots_cast/p.registered).toFixed(1):"—";
    html+=`<div class="prec ${pid===state.focus?"focus":""}" data-pid="${pid}">`
      + `<div class="ph"><span class="pid">Precinct ${esc(pid)}</span><span class="turn">turnout ${tpct}% · ${(p.ballots_cast||0).toLocaleString()}/${(p.registered||0).toLocaleString()}</span></div>`;
    if(c){ const [win]=winnerOf(c.choices); html+=resultsTable(c.choices,cmap,win); }
    else html+=`<div class="noballot">not on this precinct’s ballot</div>`;
    html+=`</div>`;
  });

  const src=(elections.find(e=>e.id===state.election).sources)||{};
  html+=`<div class="credit">Precinct results: Alameda County ROV Statement of Vote, verified against the certified District Canvass. `
    + `District lines: ${esc(vintage)}. Districts differ across decades — “District ${esc(d)}” is not comparable across redistricting cycles. `
    + (src.election_page?`<a class="src" href="${src.election_page}" target="_blank" rel="noopener">source</a>`:"")+`</div>`;
  panel.innerHTML=html;

  const rb=document.getElementById("resetBtn");
  if(rb) rb.onclick=()=>{ state.district="1"; state.focus=null; render(); };
  panel.querySelectorAll(".prec").forEach(el=> el.querySelector(".ph").onclick=()=>{
    state.focus=el.dataset.pid; render();
    map.flyTo({center: precinctCenter(el.dataset.pid), duration:500, zoom: Math.max(map.getZoom(),13)});
  });
}

function precinctCenter(pid){
  const src=map.getSource("precincts"); const data=src&&src._data;
  const f=data&&data.features.find(x=>x.properties.precinct===pid);
  if(!f) return map.getCenter();
  const b=new maplibregl.LngLatBounds(); eachCoord(f.geometry,c=>b.extend(c)); return b.getCenter();
}

function wireControls(){
  document.getElementById("electionSel").onchange=e=>{ state.contest=null; state.district="1"; state.focus=null; loadElection(e.target.value); };
  document.getElementById("contestSel").onchange=e=>{ state.contest=e.target.value; render(); };
  document.getElementById("choiceSel").onchange=e=>{ state.choice=e.target.value; render(); };
  document.querySelectorAll(".modes button").forEach(b=> b.onclick=()=>{
    document.querySelectorAll(".modes button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); state.mode=b.dataset.mode; render(); });
}

function updateHash(){
  const parts=[state.election, slug(state.contest), state.mode];
  if(state.mode==="choice") parts.push(slug(state.choice));
  parts.push("d"+state.district);
  history.replaceState(null,"","#"+parts.join("/"));
}
function parseHash(){
  const h=location.hash.replace(/^#/,"").split("/").filter(Boolean);
  state.election=elections.find(e=>e.id===h[0])?.id||elections[0].id;
  if(h[2]&&["winner","choice","turnout"].includes(h[2])) state.mode=h[2];
  document.querySelectorAll(".modes button").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.mode));
  const dtok=h.find(t=>/^d.+/.test(t)&&t!==h[0]); if(dtok) state.district=dtok.slice(1);
  state._pendingContestSlug=h[1]; state._pendingChoiceSlug=(state.mode==="choice"?h[3]:null);
}

boot();
</script>
</body>
</html>
